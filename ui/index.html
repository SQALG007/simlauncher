<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimLauncher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 4 2%22%3E%3Crect width=%221%22 height=%222%22 fill=%22%23d42a2a%22/%3E%3Crect x=%221%22 width=%221%22 height=%222%22 fill=%22%23efeee8%22/%3E%3Crect x=%222%22 width=%221%22 height=%222%22 fill=%22%23d42a2a%22/%3E%3Crect x=%223%22 width=%221%22 height=%222%22 fill=%22%23efeee8%22/%3E%3C/svg%3E">
<style>
:root{
  --asphalt:#26282c; --tarmac:#33363b; --line:#474b52;
  --chalk:#efeee8; --mute:#a3a6ad;
  --kerb:#d42a2a; --go:#2fb36b; --amber:#f2b705;
  --cond: "Bahnschrift", "DIN Alternate", "Arial Narrow", sans-serif;
  --body: "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--asphalt);color:var(--chalk);font:15px/1.5 var(--body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

header{display:flex;align-items:center;gap:28px;padding:14px 28px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:26px;letter-spacing:.02em;display:flex;align-items:center;gap:12px}
.kerb{width:34px;height:14px;background:repeating-linear-gradient(90deg,var(--kerb) 0 8.5px,var(--chalk) 8.5px 17px);border-radius:2px}
nav{display:flex;gap:4px}
nav button{background:none;border:0;padding:8px 14px;border-radius:6px;color:var(--mute);cursor:pointer;font-family:var(--cond);font-size:17px}
nav button[aria-selected=true]{color:var(--chalk);background:var(--tarmac)}
header .spacer{flex:1}
.ver{font-family:var(--sans,inherit);font-stretch:normal;font-weight:500;font-size:13px;color:var(--mute);letter-spacing:0;align-self:flex-end;margin-bottom:4px}
.upd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 28px;background:#1d3b2a;border-bottom:1px solid #2e6b46;font-size:14px}
.upd[hidden]{display:none}
.upd b{font-weight:700}
.upd .act{background:var(--go);color:#fff;border:0;border-radius:4px;padding:6px 14px;font-weight:700;cursor:pointer}
.upd .act[disabled]{opacity:.6;cursor:wait}
.upd a{color:#bfe9cf}
.quit{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;color:var(--mute);cursor:pointer}

main{padding:24px 28px 40px;max-width:1240px;margin:0 auto}
.view{display:none}.view.on{display:block}

/* ---- Jeux ---- */
.paddock{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.plate{position:relative;text-align:left;background:var(--chalk);color:#1d1e21;border:0;border-radius:4px;padding:16px 16px 14px 22px;cursor:pointer;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.plate::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;border-radius:4px 0 0 4px;background:var(--c,#888)}
.plate h3{margin:0;font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:25px;line-height:1.05}
.plate .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#55585e}
.plate .go{font-family:var(--cond);font-weight:700;font-size:15px;color:#1d1e21}
.plate:hover .go,.plate:focus-visible .go{color:var(--kerb)}
.plate[disabled]{opacity:.45;cursor:not-allowed}
.plate.live{outline:3px solid var(--go)}
.plate.pic{background:#111 var(--img) center/cover no-repeat;color:#fff}
.plate.pic::after{content:"";position:absolute;inset:0;border-radius:4px;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.05) 45%,rgba(0,0,0,.75) 100%);pointer-events:none}
.plate.pic>*{position:relative;z-index:1}
.plate.pic h3{text-shadow:0 2px 6px rgba(0,0,0,.6)}
.plate.pic .meta,.plate.pic .go{color:#fff}
.plate.pic .go{background:rgba(0,0,0,.55);padding:3px 10px;border-radius:3px}
.plate.pic:hover .go,.plate.pic:focus-visible .go{color:#fff;text-decoration:underline;text-underline-offset:3px;background:rgba(0,0,0,.8)}
.plate.noname h3{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.plate.noname{justify-content:flex-end}
.thumb{width:72px;height:40px;border-radius:3px;object-fit:cover;background:#222;flex:none}
.plate .play{font-size:12px;color:#6b6e74;margin-top:auto;padding-top:6px}
.plate.pic .play{color:#e8e8e8;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.plate .profs{display:flex;gap:6px}
.plate .prof{font-size:13px;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:2px 9px;color:#2b2e33;background:rgba(255,255,255,.55)}
.plate .prof:hover{background:#fff}
.plate.pic .prof{color:#fff;background:rgba(0,0,0,.55);border-color:rgba(255,255,255,.7)}
.plate.pic .prof:hover{background:rgba(0,0,0,.85);text-decoration:underline}
/* ----- Styles de carte : band (A), sheet (B), row (C) ----- */
.plates.cs-row{grid-template-columns:1fr}
.card{position:relative;display:flex;flex-direction:column;border-radius:6px;overflow:hidden;--art:linear-gradient(135deg,var(--c,#888),#1b1d21)}
.card.live{outline:3px solid var(--go);outline-offset:1px}
.card .art{position:relative;aspect-ratio:460/215;background:var(--img,var(--art)) center/cover no-repeat}
.card .art h3{position:absolute;left:14px;bottom:10px;right:14px;margin:0;font-family:var(--cond);font-stretch:condensed;font-weight:700;font-size:24px;line-height:1.05;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.card .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.card button{font:inherit;cursor:pointer}
.card button[disabled]{opacity:.45;cursor:not-allowed}
.card .tag{font-size:12px;background:var(--go);color:#fff;border-radius:3px;padding:1px 6px}
/* A : bandeau sombre */
.cs-band .card{background:#1b1d21;border-left:5px solid var(--c,#888)}
.cs-band .info{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px}
.cs-band .txt{flex:1 1 150px;min-width:0;display:flex;flex-direction:column;gap:2px}
.cs-band .txt>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-band .h{font-weight:700;font-size:17px;white-space:nowrap}.cs-band .h small{font-weight:400;color:var(--mute);font-size:13px;margin-left:6px}
.cs-band .n{color:var(--mute);font-size:13px}
.cs-band .acts{margin-left:auto}
.cs-band .acts button{background:var(--kerb,#e5383b);color:#fff;border:0;border-radius:5px;padding:9px 16px;font-weight:700}
.cs-band .acts button:hover:not([disabled]){filter:brightness(1.12)}
/* B : fiche claire */
.cs-sheet .card{background:var(--chalk);color:#24262b;border-radius:8px}
.cs-sheet .art{border-bottom:4px solid var(--c,#888)}
.cs-sheet .chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 8px}
.cs-sheet .chip{background:#e1ded6;border-radius:999px;padding:3px 10px;font-size:13px}
.cs-sheet .chip.on{background:var(--go);color:#fff}
.cs-sheet .nm{padding:10px 12px 0}
.cs-sheet .acts{padding:0 12px 12px;margin-top:auto}
.cs-sheet .acts button{flex:1;background:#24262b;color:#fff;border:0;border-radius:5px;padding:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.cs-sheet .acts button:hover:not([disabled]){background:var(--kerb,#e5383b)}
/* C : horizontale */
.cs-row .card{display:grid;grid-template-columns:56% minmax(0,1fr);background:var(--tarmac);border-top:4px solid var(--c,#888)}
.cs-row .art{aspect-ratio:auto;min-height:150px}
.cs-row .side{display:flex;flex-direction:column;gap:2px;padding:10px 14px}
.cs-row .big{font:700 28px/1 var(--cond);font-stretch:condensed}
.cs-row .lab{color:var(--mute);font-size:12px}
.cs-row .acts{margin-top:auto;padding-top:8px}
.cs-row .acts button{flex:1;background:none;border:1px solid var(--chalk);color:var(--chalk);border-radius:5px;padding:7px;font-weight:700}
.cs-row .acts button:hover:not([disabled]){background:var(--kerb,#e5383b);border-color:var(--kerb,#e5383b)}
/* Aperçus dans Réglages › Apparence */
.opts{background:var(--tarmac);border-radius:8px;overflow:hidden}
.opt{display:flex;flex-direction:row;text-align:left;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--chalk);font-size:15px}
.opt:last-child{border-bottom:0}
.opt .ot{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.opt small{color:var(--mute);font-size:12.5px}
.toggle{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:24px;border-radius:12px;background:#4a4e55;position:relative;cursor:pointer;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle:checked{background:var(--go)}
.toggle:checked::after{left:23px}
.toggle:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.toggle,.toggle::after{transition:none}}
.bak{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gh{color:var(--chalk);text-underline-offset:3px}
.gh:hover{color:#fff}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.styles label{display:flex;flex-direction:column;gap:8px;background:var(--tarmac);border:2px solid transparent;border-radius:8px;padding:10px;cursor:pointer;color:var(--chalk);font-size:14px}
.styles label:has(input:checked){border-color:var(--kerb,#e5383b)}
.styles input{position:absolute;opacity:0}
.styles svg{width:100%;height:auto;border-radius:4px;background:#1b1d21}
.styles small{color:var(--mute);font-size:12px}
.plate .tag{font-size:12px;background:var(--go);color:#fff;border-radius:3px;padding:1px 6px}

.wall{background:var(--tarmac);border-radius:6px;padding:20px}
.wall h2{font-family:var(--cond);font-weight:700;font-size:19px;margin:0 0 12px}
.lights{display:flex;gap:10px;justify-content:center;padding:14px 0 6px}
.lamp{width:38px;height:38px;border-radius:50%;background:#1c1d20;box-shadow:inset 0 0 0 3px #111}
.lamp.red{background:var(--kerb);box-shadow:0 0 14px var(--kerb)}
.lamp.green{background:var(--go);box-shadow:0 0 14px var(--go)}
.step{min-height:44px;text-align:center;color:var(--chalk);font-size:14px;margin-bottom:14px}
.apps{list-style:none;margin:0 0 16px;padding:0}
.apps li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:#5a5e66;flex:none}
.dot.on{background:var(--go)}
.dot.miss{background:var(--amber)}
.apps .n{flex:1}
.apps .n small{display:block;color:var(--amber);font-size:12px}
.mini{white-space:nowrap;background:none;border:1px solid var(--line);border-radius:5px;padding:3px 10px;cursor:pointer;color:var(--mute);font-size:13px}
.mini:hover{color:var(--chalk)}
details summary{cursor:pointer;color:var(--mute);font-size:13px}
.log{font:12px/1.5 Consolas,monospace;color:var(--mute);max-height:220px;overflow:auto;white-space:pre-wrap;margin-top:8px}

/* ---- Réglages ---- */
.block{margin-bottom:34px}
.block h2{font-family:var(--cond);font-weight:700;font-size:22px;margin:0 0 4px}
.block p.hint{margin:0 0 14px;color:var(--mute);max-width:70ch}
.row{display:grid;gap:10px;background:var(--tarmac);border-radius:6px;padding:14px;margin-bottom:10px}
.row.app{grid-template-columns:150px minmax(0,1fr) 170px 90px auto auto}
.row.game{grid-template-columns:repeat(6,minmax(0,1fr))}
label,.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
label.inline{flex-direction:row;align-items:center;gap:6px;color:var(--chalk);font-size:13px}
input[type=text],input[type=number],input[type=url],select{background:var(--asphalt);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;color:var(--chalk)}
input[type=color]{width:44px;height:34px;border:1px solid var(--line);background:none;border-radius:5px;padding:2px}
.path{display:flex;gap:6px}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span6{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.del{background:none;border:0;color:var(--mute);cursor:pointer;align-self:end;padding:8px}
.del:hover{color:var(--kerb)}
.endbtn{margin-top:14px;width:100%;background:none;border:1px solid #6b2a2a;color:#ff8a80;border-radius:6px;padding:9px 12px;font-weight:600;cursor:pointer}
.endbtn:hover:not([disabled]){background:#3a1c1c}
.endbtn[disabled]{opacity:.45;cursor:default}
.steam-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:12px 0}
.steam-list label{display:flex;flex-direction:row;align-items:center;gap:10px;background:var(--panel2,#2b2e33);border:1px solid var(--line);border-radius:6px;padding:8px;color:inherit;font-size:14px;cursor:pointer}
.steam-list label.done{opacity:.55;cursor:default}
.steam-list img{width:96px;height:45px;object-fit:cover;border-radius:3px;background:#111;flex:none}
.steam-list small{display:block;color:var(--mute);font-size:12px}
.hook{display:flex;gap:8px;align-items:center}
.hook input{flex:1}
.add{background:none;border:1px dashed var(--line);border-radius:6px;padding:9px 14px;color:var(--mute);cursor:pointer}
.setwrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px;align-items:start}
.subnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
.subnav button{text-align:left;background:none;border:0;border-radius:6px;padding:9px 12px;color:var(--mute);cursor:pointer;font-family:var(--cond);font-size:16px}
.subnav button:hover{color:var(--chalk)}
.subnav button[aria-selected=true]{color:var(--chalk);background:var(--tarmac);box-shadow:inset 3px 0 0 var(--red,#d62828)}
.subnav .count{font-family:inherit;font-size:12px;color:var(--mute);margin-left:6px}
.pane{display:none}.pane.on{display:block}
details.item{background:var(--tarmac);border-radius:6px;margin-bottom:8px}
details.item>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-radius:6px}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary::before{content:"▸";color:var(--mute);width:10px}
details.item[open]>summary::before{content:"▾"}
details.item>summary:hover{background:rgba(255,255,255,.03)}
details.item .sw{width:6px;height:28px;border-radius:2px;flex:none}
details.item .sthumb{width:64px;height:30px;object-fit:cover;border-radius:3px;background:#111;flex:none}
details.item .sname{font-weight:600}
details.item .smeta{color:var(--mute);font-size:13px;margin-left:auto;text-align:right}
details.item .smeta .warn{color:#ff8a80}
details.item>.row{margin:0;background:none;border-top:1px solid var(--line);border-radius:0 0 6px 6px}
@media (max-width:820px){.setwrap{grid-template-columns:1fr}.subnav{flex-direction:row;flex-wrap:wrap;position:static}}
.bar{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;padding:14px 0;background:var(--asphalt);border-top:1px solid var(--line)}
.primary{background:var(--kerb);border:0;border-radius:6px;padding:10px 20px;font-weight:600;cursor:pointer;color:#fff}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:10px 16px;cursor:pointer;color:var(--mute)}
.msg{font-size:14px}.msg.err{color:#ff8a80}.msg.ok{color:var(--go)}
.missing{color:var(--amber);font-size:12px}

/* ---- Stream Deck ---- */
.sd{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sd code{font:13px Consolas,monospace;background:var(--tarmac);padding:8px 10px;border-radius:5px;overflow-x:auto;white-space:nowrap}
.howto{max-width:72ch;color:var(--mute)}
.howto li{margin-bottom:6px}

@media (max-width:900px){
  .paddock{grid-template-columns:1fr}
  .row.app,.row.game{grid-template-columns:1fr 1fr}
  .sd{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.lang{width:auto;background:var(--asphalt);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--chalk)}
nav button,.quit{white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="kerb" aria-hidden="true"></span>SimLauncher <span class="ver" id="ver"></span></div>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-v="games" data-i18n="tab_games"></button>
    <button role="tab" aria-selected="false" data-v="settings" data-i18n="tab_settings"></button>
    <button role="tab" aria-selected="false" data-v="deck" data-i18n="tab_deck"></button>
  </nav>
  <span class="spacer"></span>
  <select class="lang" id="lang" aria-label="Language">
    <option value="auto">Auto</option><option value="fr">Français</option><option value="en">English</option>
    <option value="pt">Português</option><option value="es">Español</option><option value="zh">中文</option>
  </select>
  <button class="quit" id="quit"></button>
</header>
<div class="upd" id="upd" hidden role="status">
  <span id="upd-text"></span>
  <button class="act" id="upd-go" type="button" data-i18n="upd_install"></button>
  <a id="upd-notes" href="#" target="_blank" rel="noopener" data-i18n="upd_notes"></a>
</div>

<main>
  <section class="view on" id="v-games">
    <div class="paddock">
      <div class="plates" id="plates"></div>
      <aside class="wall">
        <div class="lights" aria-hidden="true">
          <span class="lamp"></span><span class="lamp"></span><span class="lamp"></span><span class="lamp"></span><span class="lamp"></span>
        </div>
        <div class="step" id="step" aria-live="polite"></div>
        <h2 data-i18n="apps_title"></h2>
        <ul class="apps" id="apps"></ul>
        <button class="endbtn" id="end" type="button" data-i18n="end_btn"></button>
        <details><summary data-i18n="log"></summary><div class="log" id="log"></div></details>
      </aside>
    </div>
  </section>

  <section class="view" id="v-settings">
    <div class="setwrap">
      <div class="subnav" role="tablist">
        <button role="tab" data-sv="general" data-i18n="sv_general"></button>
        <button role="tab" data-sv="look" data-i18n="sv_look"></button>
        <button role="tab" data-sv="games" data-i18n="sv_games"></button>
        <button role="tab" data-sv="apps" data-i18n="sv_apps"></button>
        <button role="tab" data-sv="profiles" data-i18n="sv_profiles"></button>
        <button role="tab" data-sv="integrations" data-i18n="sv_integrations"></button>
        <button role="tab" data-sv="updates" data-i18n="sv_updates"></button>
      </div>
      <div class="panes">
      <div class="pane" data-pane="general">
          <div class="block">
            <h2 data-i18n="beh_title"></h2>
            <div class="opts">
              <label class="opt"><span class="ot"><span data-i18n="autostart"></span><small data-i18n="autostart_d"></small><span class="msg" id="auto-msg"></span></span><input type="checkbox" class="toggle" id="s-auto"></label>
              <label class="opt"><span class="ot"><span data-i18n="keep_tray"></span><small data-i18n="keep_tray_d"></small></span><input type="checkbox" class="toggle" id="s-keep"></label>
              <label class="opt"><span class="ot"><span data-i18n="graceful"></span><small data-i18n="graceful_d"></small></span><input type="checkbox" class="toggle" id="s-graceful"></label>
              <label class="opt"><span class="ot"><span data-i18n="close_on_exit"></span><small data-i18n="close_on_exit_d"></small></span><input type="checkbox" class="toggle" id="s-close"></label>
            </div>
          </div>
          <div class="block">
            <h2 data-i18n="seq_title"></h2>
            <p class="hint" data-i18n="seq_hint"></p>
            <div class="row game">
              <label><span data-i18n="pause"></span><input type="number" min="0" max="120" id="s-delay"></label>
              <label><span data-i18n="port"></span><input type="number" min="1024" max="65535" id="s-port"></label>
            </div>
          </div>
          <div class="block">
            <h2 data-i18n="bak_title"></h2>
            <p class="hint" data-i18n="bak_hint"></p>
            <div class="bak">
              <button class="ghost" type="button" id="cfg-export" data-i18n="bak_export"></button>
              <button class="ghost" type="button" id="cfg-import" data-i18n="bak_import"></button>
              <input type="file" id="cfg-file" accept=".json,application/json" hidden>
              <span class="msg" id="bak-msg"></span>
            </div>
          </div>
        </div>

let L='en';
const t=(k,v={})=>((I18N[L]&&I18N[L][k])??I18N.en[k]??k).replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');
function applyI18n(){
  document.documentElement.lang=L;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(e=>e.innerHTML=t(e.dataset.i18nHtml));
}

const $=s=>document.querySelector(s);
let state=null, draft=null, dirty=false, langApplied=null;

async function api(path,body){
  const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'X-SimLauncher':'1','Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||t('error_n',{n:r.status}));
  return j;
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
  if(b.dataset.v==='settings'&&!dirty) loadDraft();
});

/* ----- Jeux ----- */
// Nom affiché d'un profil : les profils par défaut (vr, ecran/flat) suivent la langue,
// sauf si l'utilisateur leur a donné un nom à lui.
const FLAT_NAMES=new Set(Object.values(I18N).map(d=>d.prof_flat).concat(['Ecran','Screen','Flat screen']));
function profName(p){
  if(['ecran','flat','screen'].includes(p.id) && (!p.name||FLAT_NAMES.has(p.name))) return t('prof_flat');
  return p.name;
}
function fmtLast(st){
  if(!st||!st.lastPlayed) return '';
  const d0=new Date(); d0.setHours(0,0,0,0);
  const days=Math.floor((d0-new Date(st.lastPlayed*1000))/864e5)+1;
  return st.lastPlayed*1000>=d0.getTime()?t('pt_today'):days===1?t('pt_yesterday'):days<30?t('pt_days',{n:days}):new Date(st.lastPlayed*1000).toLocaleDateString(L);
}
function fmtPlay(st){
  if(!st||!st.seconds&&!st.lastPlayed) return '';
  const m=Math.round((st.seconds||0)/60), h=Math.floor(m/60);
  const dur=h?t('pt_h',{h,m:String(m%60).padStart(2,'0')}):m?t('pt_m',{m}):'';
  if(!st.lastPlayed) return dur;
  const d0=new Date(); d0.setHours(0,0,0,0);
  const days=Math.floor((d0-new Date(st.lastPlayed*1000))/864e5)+1;
  const last=st.lastPlayed*1000>=d0.getTime()?t('pt_today'):days===1?t('pt_yesterday'):days<30?t('pt_days',{n:days}):new Date(st.lastPlayed*1000).toLocaleDateString(L);
  return dur?`${dur} · ${last}`:last;
}
function imgVer(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))|0; return (h>>>0).toString(36); }
function cardHTML(g,cs,busy){
  const st=(state.stats||{})[g.id]||{}, profs=state.config.profiles||[];
  const img=g.image?`--img:url('/api/image/${encodeURIComponent(g.id)}?v=${encodeURIComponent(imgVer(g.image))}')`:'';
  const showName=!g.image||!g.hideName, artName=!g.image;
  const acts=`<span class="acts">${(profs.length?profs:[{id:'',name:t('launch')}]).map(p=>`<button type="button" data-g="${esc(g.id)}" data-p="${esc(p.id)}" ${busy?'disabled':''}>${esc(profName(p))}</button>`).join('')}</span>`;
  const apps=g.apps.length===1?t('apps_one'):t('apps_many',{n:g.apps.length});
  const m=Math.round((st.seconds||0)/60), dur=m?(m>=60?t('pt_h',{h:Math.floor(m/60),m:String(m%60).padStart(2,'0')}):t('pt_m',{m})):'';
  const last=fmtLast(st);
  const art=`<div class="art">${artName?`<h3>${esc(g.name)}</h3>`:''}</div>`;
  const nm=showName&&!artName?`<span class="nm">${esc(g.name)}</span>`:'';
  let body='';
  if(cs==='band') body=`<div class="info"><div class="txt">${nm}<span class="h">${dur||''}${last?`<small${dur?'':' style="margin:0"'}>${esc(last)}</small>`:''}</span><span class="n">${g.running?`<span class="tag">${t('running')}</span>`:esc(apps)}</span></div>${acts}</div>`;
  else if(cs==='sheet') body=`${nm}<div class="chips">${dur?`<span class="chip"><b>${esc(dur)}</b></span>`:''}${last?`<span class="chip">${esc(last)}</span>`:''}<span class="chip">${esc(apps)}</span>${g.running?`<span class="chip on">${t('running')}</span>`:''}</div>${acts}`;
  else body=`<div class="side">${nm}<span class="big">${dur||'—'}</span><span class="lab">${g.running?t('running'):esc(last||'')}</span><span class="lab">${esc(apps)}</span>${acts}</div>`;
  return `<div class="card ${g.running?'live':''}" style="--c:${esc(g.color||'#888')};${img}">${art}${body}</div>`;
}

function renderGames(){

    </button>`).join('') || `<p>${t('no_games')}</p>`;
  document.querySelectorAll('.plate').forEach(p=>p.onclick=e=>{ const pr=e.target.closest('.prof'); const profs=state.config.profiles||[]; launch(p.dataset.g, pr?pr.dataset.p:(profs[0]||{}).id||''); });

    </li>`).join('');
  document.querySelectorAll('.mini[data-a]').forEach(b=>b.onclick=async()=>{
    b.disabled=true; try{await api(`/api/app/${b.dataset.a}/${b.dataset.act}`,{})}catch(e){alert(e.message)} refresh();

  $('#step').textContent=st.step||t('idle');
  $('#log').textContent=hist.join('\n');
}

// Lignes repliables : un résumé cliquable, le détail s'ouvre au clic. L'état ouvert survit aux rafraîchissements.
const openItems=new Set();
function collapse(sel,kind,list,sum){
  document.querySelectorAll(sel+' > .row[data-i]').forEach(row=>{
    const i=+row.dataset.i, key=kind+':'+i, d=document.createElement("details");
    d.className='item'; d.open=openItems.has(key);
    d.innerHTML=`<summary>${sum(list[i])}</summary>`;
    row.replaceWith(d); d.appendChild(row);
    d.addEventListener('toggle',()=>d.open?openItems.add(key):openItems.delete(key));
  });
}
function renderSubnavCounts(){
  const n={games:draft.games.length,apps:draft.apps.length,profiles:draft.profiles.length};
  document.querySelectorAll('.subnav button').forEach(b=>{
    const k=b.dataset.sv; b.textContent=t("sv_"+k);
    if(n[k]!==undefined){ const c=document.createElement("span"); c.className='count'; c.textContent=n[k]; b.appendChild(c); }
  });
}
function showPane(k){
  if(!document.querySelector(`.pane[data-pane="${k}"]`)) k='general';
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.dataset.pane===k));
  document.querySelectorAll('.subnav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.sv===k));
  try{ localStorage.setItem('sl.pane',k); }catch(e){}
}
document.querySelectorAll('.subnav button').forEach(b=>b.onclick=()=>showPane(b.dataset.sv));
(()=>{ let k='general'; try{ k=localStorage.getItem('sl.pane')||k; }catch(e){} showPane(k); })();

function listOf(row){ return row.classList.contains('app')?draft.apps:row.classList.contains('prof')?draft.profiles:draft.games; }

function bindEditor(){
  $('#v-settings').addEventListener('input',e=>{
    const tg=e.target, row=tg.closest('.row[data-i]');
    if(tg.id==='s-delay') draft.settings.delayBeforeGame=+tg.value;
    else if(tg.id==='s-close') draft.settings.closeAppsOnExit=tg.checked;
    else if(tg.id==='s-keep') draft.settings.keepInTray=tg.checked;
    else if(tg.id==='s-graceful') draft.settings.forceClose=!tg.checked;
    else if(tg.id==='s-port') draft.settings.uiPort=+tg.value;
    else if(tg.name==='cs') draft.settings.cardStyle=tg.value==='classic'?'':tg.value;
    else if(tg.id==='s-upd') draft.settings.noUpdateCheck=!tg.checked;
    else if(tg.id==='s-upd-auto') draft.settings.autoUpdate=tg.checked;
    else if(tg.id==='s-hook-start') draft.settings.webhookStart=tg.value.trim();
    else if(tg.id==='s-hook-end') draft.settings.webhookEnd=tg.value.trim();
    else if(tg.id==='s-auto') return;
    else if(row){
      const list=listOf(row), obj=list[+row.dataset.i];
      if(tg.dataset.app){ obj.apps=tg.checked?[...new Set([...obj.apps,tg.dataset.app])]:obj.apps.filter(x=>x!==tg.dataset.app); }
      else if(tg.dataset.k){
        const v=tg.type==='checkbox'?tg.checked:tg.type==='number'?+tg.value:tg.value;
        if(tg.dataset.k==='id' && row.classList.contains('app')){ const old=obj.id; [...draft.games,...draft.profiles].forEach(g=>g.apps=g.apps.map(x=>x===old?v:x)); }
        obj[tg.dataset.k]=v;
      }
    } else return;
    mark();
  });
  $('#v-settings').addEventListener('click',async e=>{
    const tg=e.target, row=tg.closest('.row[data-i]');
    if(!row) return;
    const isApp=row.classList.contains('app'), list=listOf(row), i=+row.dataset.i;
    if(tg.dataset.del){
      if(!confirm(t('del_confirm',{name:list[i].name}))) return;
      if(isApp){ const id=list[i].id; [...draft.games,...draft.profiles].forEach(g=>g.apps=g.apps.filter(x=>x!==id)); }
      list.splice(i,1); mark(); renderEditor();
    } else if(tg.dataset.move){
      const j=i+ +tg.dataset.move; if(j<0||j>=list.length) return;
      [list[i],list[j]]=[list[j],list[i]];
      if(isApp){ const order=list.map(a=>a.id); draft.games.forEach(g=>g.apps.sort((a,b)=>order.indexOf(a)-order.indexOf(b))); }
      mark(); renderEditor();
    } else if(tg.dataset.steamimg){
      try{ const r=await api('/api/steam/copycover',{appId:list[i].steamAppId,gameId:list[i].id});
        list[i].image=r.path; list[i].hideName=true; mark(); renderEditor(); }catch(err){alert(err.message)}
    } else if(tg.dataset.clearimg){
      list[i].image=''; mark(); renderEditor();
    } else if(tg.dataset.pick){
      const img=tg.dataset.pick==='image', k=img?'image':isApp?'path':'exePath';
      try{ const r=await api('/api/pick?'+(img?'kind=image&':'')+'initial='+encodeURIComponent(list[i][k]||''),{});
        if(r.path){ list[i][k]=r.path;
          if(isApp && !list[i].process) list[i].process=r.path.split('\\').pop();
          mark(); renderEditor(); } }catch(err){alert(err.message)}
    }
  });
  $('#add-prof').onclick=()=>{ const n=draft.profiles.length+1; draft.profiles.push({id:'profile'+n,name:t('prof_new'),apps:draft.apps.map(a=>a.id)}); mark(); renderEditor(); };
  $('#add-app').onclick=()=>{ const n=draft.apps.length+1; openItems.add('app:'+(n-1)); draft.apps.push({id:'app'+n,name:t('new_app'),path:'',args:'',process:'',delayAfter:2,closeOnExit:false}); mark(); renderEditor(); };
  $('#add-game').onclick=()=>{ const n=draft.games.length+1; openItems.add('game:'+(n-1)); draft.games.push({id:'game'+n,name:t('new_game'),enabled:true,steamAppId:'',exePath:'',exeArgs:'',process:'',apps:draft.apps.map(a=>a.id),color:'#888888'}); mark(); renderEditor(); };
  $('#save').onclick=async()=>{
    const order=draft.apps.map(a=>a.id); draft.games.forEach(g=>g.apps.sort((a,b)=>order.indexOf(a)-order.indexOf(b)));
    draft.settings.language=state.config.settings.language;
    try{ await api('/api/config',draft); dirty=false; $('#msg').className='msg ok'; $('#msg').textContent=t('saved'); await refresh(); renderEditor(); }
    catch(e){ $('#msg').className='msg err'; $('#msg').textContent=e.message; }
  };
  $('#revert').onclick=()=>loadDraft();
  $('#reset').onclick=async()=>{ if(!confirm(t('reset_confirm'))) return; await api('/api/reset',{}); await refresh(); loadDraft(); };
}

$('#end').onclick=async()=>{
  if(!confirm(t('end_confirm'))) return;
  $('#end').disabled=true;
  try{ await api('/api/end',{}); }catch(e){ alert(e.message); }

// Sauvegarde de la configuration : export en fichier JSON, import avec validation par le serveur.
$('#cfg-export').onclick=()=>{
  const d=new Date(), stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const blob=new Blob([JSON.stringify(state.config,null,2)],{type:'application/json'});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`simlauncher-config-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  const m=$('#bak-msg'); m.className='msg ok'; m.textContent=t('bak_exported');
};
$('#cfg-import').onclick=()=>{ $('#cfg-file').value=''; $('#cfg-file').click(); };
$('#cfg-file').onchange=async e=>{
  const f=e.target.files[0], m=$('#bak-msg'); if(!f) return;
  let cfg; try{ cfg=JSON.parse(await f.text()); }catch(err){ m.className='msg err'; m.textContent=t('bak_bad'); return; }
  if(!cfg||!Array.isArray(cfg.games)||!Array.isArray(cfg.apps)||!cfg.settings){ m.className='msg err'; m.textContent=t('bak_bad'); return; }
  if(!confirm(t('bak_confirm',{g:cfg.games.length,a:cfg.apps.length}))) return;
  try{ await api('/api/config',cfg); await refresh(); loadDraft(); m.className='msg ok'; m.textContent=t('bak_imported'); }
  catch(err){ m.className='msg err'; m.textContent=err.message; }
};

function renderDeck(){
  const exe=state.exePath;
  const profs=state.config.profiles||[];
  const line=(label,cmd)=>`<div class="sd"><strong>${esc(label)}</strong><code>${esc(cmd)}</code><button class="mini" data-copy="${esc(cmd)}">${t('copy')}</button></div>`;
  $('#sd').innerHTML=state.config.games.map(g=>profs.length
    ? profs.map(p=>line(`${g.name} · ${profName(p)}`,`"${exe}" --game ${g.id} --profile ${p.id}`)).join('')
    : line(g.name,`"${exe}" --game ${g.id}`)).join('') + (()=>{ const cmd=`"${exe}" --end`; return `<div class="sd"><strong>${t('end_btn')}</strong><code>${esc(cmd)}</code><button class="mini" data-copy="${esc(cmd)}">${t('copy')}</button></div>`; })();
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{
    await navigator.clipboard.writeText(b.dataset.copy); b.textContent=t('copied'); setTimeout(()=>b.textContent=t('copy'),1500);
  });
}

let bootVersion='';
function renderUpdate(){
  const u=state.update||{};
  $('#ver').textContent='v'+state.version;
  const show=u.available||u.installing;
  $('#upd').hidden=!show;
  if(show){
    $('#upd-text').innerHTML=u.installing?esc(t('upd_installing',{v:u.latest})):t('upd_banner',{v:`<b>${esc(u.latest)}</b>`});
    $('#upd-go').hidden=!!u.installing; $('#upd-go').disabled=!!u.installing;
    $('#upd-notes').href=u.notesUrl||'#'; $('#upd-notes').hidden=!u.notesUrl;
  }
  const m=$('#upd-msg');
  if(m.dataset.lock) return;
  if(u.error){ m.className='msg err'; m.textContent=t('upd_err',{e:u.error}); }
  else if(u.checked){ m.className='msg ok'; m.textContent=u.available?t('upd_banner_plain',{v:u.latest}):t('upd_uptodate',{v:state.version}); }
  else m.textContent='';
}
$('#upd-go').onclick=async()=>{
  $('#upd-go').disabled=true;
  try{ await api('/api/update/install',{}); $('#upd-text').textContent=t('upd_installing',{v:state.update.latest}); $('#upd-go').hidden=true; }
  catch(e){ alert(e.message); $('#upd-go').disabled=false; }
};
$('#upd-now').onclick=async()=>{
  const m=$('#upd-msg'); m.dataset.lock='1'; m.className='msg'; m.textContent=t('upd_checking');
  try{ await api('/api/update/check',{}); }catch(e){}
  delete m.dataset.lock; await refresh();
};
async function refresh(){
  try{ state=await api('/api/state'); }catch(e){ $('#step').textContent=t('stopped_msg'); return; }
  if(langApplied!==state.lang){ L=state.lang; langApplied=L; applyI18n(); renderEditor(); }
  if(document.activeElement!==$('#lang')) $('#lang').value=state.config.settings.language||'auto';
  if(!bootVersion) bootVersion=state.version; else if(state.version!==bootVersion){ location.reload(); return; }
  renderGames(); renderDeck(); renderUpdate();
  if(document.activeElement!==$('#s-auto')) $('#s-auto').checked=state.autostart;
  $('#quit').textContent=state.tray?t('quit_tray'):t('quit');
  $('#quit').title=state.tray?t('quit_tray_title'):t('quit_title');
  if(!draft) loadDraft();
}
$('#lang').addEventListener('change',async e=>{
  try{ await api('/api/language',{language:e.target.value}); await refresh(); }catch(err){ alert(err.message); }
});
$('#s-auto').addEventListener('change',async e=>{
  e.stopPropagation();
  try{ const r=await api('/api/autostart',{on:e.target.checked}); $('#auto-msg').className='msg ok'; $('#auto-msg').textContent=r.on?t('auto_on'):t('auto_off'); }
  catch(err){ e.target.checked=!e.target.checked; $('#auto-msg').className='msg err'; $('#auto-msg').textContent=err.message; }
});
$('#quit').onclick=async()=>{ await api('/api/quit',{}).catch(()=>{}); window.close(); document.body.innerHTML=`<main><p>${esc(t('quit_done'))}</p></main>`; };
L=(navigator.language||'en').slice(0,2); if(!I18N[L]) L='en'; applyI18n();
bindEditor(); refresh(); setInterval(refresh,1500);
</script>
</body>
</html>
